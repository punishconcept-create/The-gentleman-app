<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080603">
  <title>The Gentleman — Administration</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080603;color:#ead8b4;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;min-height:100dvh;padding:14px;
  background:radial-gradient(circle at 80% 5%,rgba(177,116,34,.18),transparent 31%),
             linear-gradient(150deg,#020202,#090704 70%,#171006)
}
.wrap{
  width:100%;max-width:620px;margin:auto;padding:22px 16px 28px;border:2px solid #9b6728;border-radius:24px;
  background:linear-gradient(155deg,#070707,#100c07 72%,#090603)
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
  width:48px;height:48px;border-radius:14px;border:1px solid #68461d;background:#15110c;color:#e1bf82;
  font-size:22px;font-weight:900
}
.brand{flex:1;text-align:center}
.the{font:12px Georgia,serif;letter-spacing:7px;color:#cda45e}
h1{font:500 clamp(31px,9vw,44px) Georgia,serif;color:#d3a554;margin:0}
.tag{font:italic 15px Georgia,serif;color:#bd914d}
.spacer{width:48px}
.rule{height:1px;margin:18px auto;width:72%;background:linear-gradient(90deg,transparent,#956126,transparent)}
.sectionTitle{text-align:center;color:#ddb76d;font-size:22px;font-weight:900;margin:0 0 8px}
.sectionDesc{text-align:center;color:#9f927f;font-size:14px;line-height:1.5;margin:0 0 20px}
label{display:block;margin:17px 0 7px;font-weight:900;font-size:15px}
input{
  width:100%;min-height:58px;padding:12px 14px;border:2px solid #986523;border-radius:13px;
  background:#f2eee7;color:#111;font-size:17px
}
button{font-family:inherit;cursor:pointer}
.gold{background:linear-gradient(#dfb35e,#a86e23);color:#160e05;border:0}
.dark{background:#17130d;color:#d6ad65;border:1px solid #74501f}
.danger{background:#351111;color:#efb9a4;border:1px solid #784137}
.action{
  width:100%;min-height:60px;margin-top:10px;border-radius:13px;font-size:16px;font-weight:900
}
.status{
  margin-top:13px;padding:13px;border:1px solid #68461d;border-radius:13px;background:#15110c;
  text-align:center;line-height:1.45;color:#cbbda5
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cardItem{
  padding:14px;border:1px solid #68461d;border-radius:14px;background:#15110c
}

.photoPreview{
  width:min(100%,330px);
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  margin:12px auto;
  border:2px solid #a6752d;
  border-radius:18px;
  background:#080603;
}
.photoActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.help{
  margin-top:6px;
  color:#9f927f;
  font-size:13px;
  line-height:1.4;
}
@media(max-width:699px){
  body{padding:14px}
  .wrap{width:100%;max-width:620px;margin:auto;padding:22px 16px 28px}
  label{font-size:16px}
  input{min-height:60px;font-size:18px}
  .action{min-height:62px;font-size:17px}
}
</style>
</head>
<body>
<iframe id="gentlemanBridge" name="gentlemanBridge" style="display:none;width:0;height:0;border:0"></iframe>
<div class="wrap">
  <div class="top">
    <button class="back" type="button" onclick="location.href='./'">←</button>
    <div class="brand">
      <div class="the">THE</div>
      <h1>GENTLEMAN</h1>
      <div class="tag">Administration</div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="rule"></div>

  <label for="pin">🔐 PIN ADMINISTRATEUR</label>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN ADMINISTRATEUR">

  <label for="search">🔎 RECHERCHER UNE CARTE</label>
  <input id="search" type="text" placeholder="GC-005, pseudo, événement…">

  <div class="grid2" style="margin-top:10px">
    <button class="action gold" type="button" onclick="chercher()">🔎 RECHERCHER</button>
    <button class="action dark" type="button" onclick="toutAfficher()">📋 TOUTES LES CARTES</button>
  </div>

  <div id="message" class="status" style="display:none"></div>
  <div id="list" style="display:grid;gap:12px;margin-top:16px"></div>

  <div id="editor" style="display:none;margin-top:18px;padding:16px;border:1px solid #68461d;
                         border-radius:15px;background:#15110c">
    <div class="sectionTitle">MODIFIER LA CARTE</div>
    <div id="selected" class="sectionDesc"></div>

    <label for="editPseudo">👤 PSEUDO / NOM DU CLIENT</label>
    <input id="editPseudo" type="text" autocomplete="off">

    <label>📸 PHOTO DU CLIENT</label>
    <img id="editPhotoPreview" class="photoPreview" alt="Photo actuelle du client">

    <div class="photoActions">
      <button class="action gold" type="button" onclick="document.getElementById('photoCamera').click()">📷 PRENDRE UNE PHOTO</button>
      <button class="action dark" type="button" onclick="document.getElementById('photoFile').click()">🖼️ IMPORTER UNE PHOTO</button>
    </div>

    <input id="photoCamera" type="file" accept="image/*" capture="environment" style="display:none">
    <input id="photoFile" type="file" accept="image/*" style="display:none">
    <div class="help">Laisse la photo actuelle si tu ne souhaites pas la changer.</div>

    <label for="eventDate">📅 DATE DE L’ÉVÉNEMENT</label>
    <input id="eventDate" type="date">

    <label for="maxPassages">🍸 NOMBRE MAXIMUM DE PASSAGES AU BAR</label>
    <input id="maxPassages" type="number" inputmode="numeric" min="0" max="99" step="1" value="0">
    <div class="help"><strong>0 = illimité.</strong> Exemple : 1 = un seul passage autorisé pendant la soirée.</div>

    <button class="action gold" type="button" onclick="enregistrerModifications()">💾 ENREGISTRER LES MODIFICATIONS</button>

    <div class="rule" style="margin-top:24px"></div>
    <div class="sectionTitle" style="font-size:18px">ACTIVATION</div>

    <button class="action gold" type="button" onclick="reactiver()">🔄 RÉACTIVER LA CARTE</button>
    <button class="action danger" type="button" onclick="desactiver()">⛔ DÉSACTIVER L’ACTIVATION</button>

    <div class="rule" style="margin-top:24px"></div>

    <button class="action danger" style="background:#5a0d0d;color:#ffd8cf;border-color:#9b3026" type="button" onclick="supprimerCarte()">
      🗑️ SUPPRIMER DÉFINITIVEMENT LA CARTE
    </button>
  </div></div>

<script>



const BRIDGE_URL = "https://script.google.com/macros/s/AKfycbxeJnzsyuEIrMjleUmabRIEuoGU2JXbzwewxOrCu9l_hGl1Bla3R6Gg39cjt32ajr4g/exec";
const BRIDGE_TIMEOUT = 45000;

function bridgeCall(action, fields) {
  return new Promise(function(resolve) {

    const requestId =
      Date.now().toString(36) +
      Math.random().toString(36).slice(2);

    let finished = false;
    let currentScript = null;

    function finish(data) {
      if (finished) return;
      finished = true;

      if (
        currentScript &&
        currentScript.parentNode
      ) {
        currentScript.parentNode.removeChild(
          currentScript
        );
      }

      resolve(
        data || {
          ok: false,
          message: "Réponse serveur vide."
        }
      );
    }

    function poll() {
      if (finished) return;

      const callbackName =
        "__gentlemanPoll_" +
        requestId.replace(
          /[^A-Za-z0-9_$]/g,
          ""
        );

      window[callbackName] =
        function(payload) {

          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }

          if (
            currentScript &&
            currentScript.parentNode
          ) {
            currentScript.parentNode
              .removeChild(currentScript);
          }

          currentScript = null;

          if (
            payload &&
            payload.ready
          ) {
            finish(payload.data);
            return;
          }

          if (!finished) {
            setTimeout(
              poll,
              650
            );
          }
        };

      currentScript =
        document.createElement("script");

      currentScript.src =
        BRIDGE_URL +
        "?bridgePoll=" +
        encodeURIComponent(requestId) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&_=" +
        Date.now();

      currentScript.onerror =
        function() {

          try {
            delete window[callbackName];
          } catch (e) {}

          if (
            currentScript &&
            currentScript.parentNode
          ) {
            currentScript.parentNode
              .removeChild(currentScript);
          }

          currentScript = null;

          if (!finished) {
            setTimeout(
              poll,
              1000
            );
          }
        };

      document.head.appendChild(
        currentScript
      );
    }


    const form =
      document.createElement("form");

    form.method = "POST";
    form.action = BRIDGE_URL;
    form.target = "gentlemanBridge";
    form.style.display = "none";


    const values =
      Object.assign(
        {},
        fields || {},
        {
          bridgeAction: action,
          requestId: requestId
        }
      );


    Object.keys(values)
      .forEach(function(key) {

        const input =
          document.createElement("input");

        input.type = "hidden";
        input.name = key;

        input.value =
          values[key] == null
            ? ""
            : String(values[key]);

        form.appendChild(input);
      });


    document.body.appendChild(form);

    form.submit();


    setTimeout(
      function() {
        form.remove();
      },
      1200
    );


    setTimeout(
      poll,
      700
    );


    setTimeout(
      function() {

        if (!finished) {
          finish({
            ok: false,
            message:
              "Le serveur n’a pas confirmé l’opération."
          });
        }

      },
      BRIDGE_TIMEOUT
    );

  });
}

let selectedId="";

function safe(v){
  return String(v||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function pin(){
  return document.getElementById("pin").value.trim();
}
function showMessage(text){
  const el=document.getElementById("message");
  el.style.display="block";
  el.textContent=text;
}
function chercher(){
  lancer(document.getElementById("search").value.trim());
}
function toutAfficher(){
  document.getElementById("search").value="";
  lancer("");
}
async function lancer(q){
  if(!pin()) return showMessage("⚠️ Saisis le PIN administrateur.");

  showMessage("⏳ Recherche en cours…");
  document.getElementById("list").innerHTML="";

  const data=await bridgeCall("search",{
    recherche:q,
    pinAdmin:pin()
  });

  if(!data || !data.ok){
    return showMessage("❌ "+(data ? data.message : "Erreur inconnue"));
  }

  showMessage(data.cartes.length ? data.cartes.length+" carte(s) trouvée(s)." : "Aucune carte trouvée.");
  afficher(data.cartes);
}
function afficher(cartes){
  const list=document.getElementById("list");
  list.innerHTML="";

  cartes.forEach(function(c){
    const item=document.createElement("div");
    item.className="cardItem";

    let badge="⛔ Inactive";
    if(c.evenementActif) badge="✅ Active";
    else if(c.etatEvenement==="A_VENIR") badge="⏳ À venir";

    item.innerHTML=`
      <div style="display:flex;gap:12px;align-items:center">
        <img src="${safe(c.photo)}" alt="Photo du client"
             style="width:82px;height:82px;object-fit:cover;border:2px solid #a6752d;border-radius:14px">
        <div style="flex:1">
          <div style="font-size:22px;font-weight:900">${safe(c.pseudo)}</div>
          <div style="color:#d0a15a;font-weight:900">${safe(c.id)}</div>
          <div style="margin-top:4px;font-size:14px;color:#cbbda7">${safe(c.evenement||"Aucun événement")}</div>
          <div style="font-size:13px;color:#9f927f">${safe(c.dateEvenementFR||"")}</div>
          <div style="margin-top:5px;font-weight:900">${badge}</div>
          <div style="margin-top:5px;font-size:13px;color:#d8b876">
            Passages : ${Number(c.passages||0)} / ${Number(c.maxPassages||0)>0 ? Number(c.maxPassages) : "∞"}
          </div>
        </div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <button class="action gold manageBtn">⚙️ GÉRER</button>
        <button class="action dark viewBtn">🎩 VOIR LA CARTE</button>
      </div>
    `;

    item.querySelector(".manageBtn").onclick=function(){
      choisir(c.id);
    };
    item.querySelector(".viewBtn").onclick=function(){
      window.open(c.cardUrl,"_blank");
    };

    list.appendChild(item);
  });
}
let nouvellePhotoBase64 = "";

async function choisir(id){
  selectedId=id;
  nouvellePhotoBase64="";

  showMessage("⏳ Chargement de "+id+"…");

  const data=await bridgeCall("get",{
    cardId:id,
    pinAdmin:pin()
  });

  if(!data || !data.ok || !data.carte){
    return showMessage("❌ "+(data ? data.message : "Carte introuvable"));
  }

  const c=data.carte;

  document.getElementById("selected").textContent=
    "Carte "+c.id+" — "+(c.pseudo||"");

  document.getElementById("editPseudo").value=
    c.pseudo||"";

  document.getElementById("eventDate").value=
    c.dateEvenement||"";

  document.getElementById("maxPassages").value=
    Number(c.maxPassages||0);

  const preview=document.getElementById("editPhotoPreview");
  preview.src=c.photo||"";
  preview.style.display=c.photo ? "block" : "none";

  const editor=document.getElementById("editor");
  editor.style.display="block";
  editor.scrollIntoView({behavior:"smooth",block:"start"});

  showMessage("✅ "+c.id+" prête à être modifiée.");
}


function compresserPhoto(file){
  return new Promise(function(resolve,reject){
    if(!file || !file.type || !file.type.startsWith("image/")){
      reject(new Error("Sélectionne une image."));
      return;
    }

    const reader=new FileReader();

    reader.onload=function(){
      const img=new Image();

      img.onload=function(){
        const maxSize=1000;
        let width=img.width;
        let height=img.height;

        if(width>height && width>maxSize){
          height=Math.round(height*(maxSize/width));
          width=maxSize;
        }else if(height>=width && height>maxSize){
          width=Math.round(width*(maxSize/height));
          height=maxSize;
        }

        const canvas=document.createElement("canvas");
        canvas.width=width;
        canvas.height=height;

        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,width,height);

        resolve(
          canvas.toDataURL("image/jpeg",0.84)
        );
      };

      img.onerror=function(){
        reject(new Error("Photo illisible."));
      };

      img.src=reader.result;
    };

    reader.onerror=function(){
      reject(new Error("Impossible de lire la photo."));
    };

    reader.readAsDataURL(file);
  });
}


async function chargerNouvellePhoto(file){
  try{
    showMessage("⏳ Préparation de la photo…");

    nouvellePhotoBase64=
      await compresserPhoto(file);

    const preview=
      document.getElementById("editPhotoPreview");

    preview.src=nouvellePhotoBase64;
    preview.style.display="block";

    showMessage("✅ Nouvelle photo prête. Appuie sur ENREGISTRER LES MODIFICATIONS.");
  }catch(err){
    showMessage("❌ "+(err.message||"Impossible de préparer la photo."));
  }
}


document.getElementById("photoCamera")
  .addEventListener("change",function(){
    if(this.files && this.files[0]){
      chargerNouvellePhoto(this.files[0]);
    }
    this.value="";
  });

document.getElementById("photoFile")
  .addEventListener("change",function(){
    if(this.files && this.files[0]){
      chargerNouvellePhoto(this.files[0]);
    }
    this.value="";
  });


async function enregistrerModifications(){
  if(!selectedId){
    return showMessage("❌ Sélectionne une carte.");
  }

  if(!pin()){
    return showMessage("❌ Saisis le PIN administrateur.");
  }

  const pseudo=
    document.getElementById("editPseudo").value.trim();

  const dateEvenement=
    document.getElementById("eventDate").value;

  const maxPassages=
    Number(document.getElementById("maxPassages").value||0);

  if(!pseudo){
    return showMessage("❌ Le pseudo / nom du client est obligatoire.");
  }

  if(
    !Number.isInteger(maxPassages) ||
    maxPassages<0 ||
    maxPassages>99
  ){
    return showMessage("❌ Passages maximum : entre 0 et 99. 0 = illimité.");
  }

  showMessage("⏳ Enregistrement des modifications…");

  const data=await bridgeCall("update",{
    cardId:selectedId,
    pseudo:pseudo,
    photoBase64:nouvellePhotoBase64,
    dateEvenement:dateEvenement,
    maxPassages:maxPassages,
    pinAdmin:pin()
  });

  if(!data || !data.ok){
    return showMessage("❌ "+(data ? data.message : "Erreur inconnue"));
  }

  nouvellePhotoBase64="";

  showMessage("✅ "+data.message);

  setTimeout(function(){
    chercher();
  },600);
}


async function reactiver(){
  const evenement="The Gentleman";
  const dateEvenement=document.getElementById("eventDate").value;

  if(!selectedId) return showMessage("❌ Sélectionne une carte.");
  if(!dateEvenement) return showMessage("❌ Choisis la date de l’événement.");

  showMessage("⏳ Réactivation en cours…");

  const data=await bridgeCall("reactivate",{
    cardId:selectedId,
    evenement,
    dateEvenement,
    pinAdmin:pin()
  });

  if(!data || !data.ok){
    return showMessage("❌ "+(data ? data.message : "Erreur inconnue"));
  }

  showMessage("✅ "+data.id+" réactivée pour "+data.evenement+" — "+data.dateEvenementFR+".");
  document.getElementById("editor").style.display="none";
  chercher();
}
async function desactiver(){
  if(!selectedId) return showMessage("❌ Sélectionne une carte.");
  if(!confirm("Désactiver l’activation de cette carte ?")) return;

  showMessage("⏳ Désactivation en cours…");

  const data=await bridgeCall("deactivate",{
    cardId:selectedId,
    pinAdmin:pin()
  });

  if(!data || !data.ok){
    return showMessage("❌ "+(data ? data.message : "Erreur inconnue"));
  }

  showMessage("✅ Activation désactivée.");
  document.getElementById("editor").style.display="none";
  chercher();
}


async function supprimerCarte(){
  if(!selectedId) {
    return showMessage("❌ Sélectionne une carte.");
  }

  if(!pin()) {
    return showMessage("❌ Saisis le PIN administrateur.");
  }

  const confirmation1 =
    confirm(
      "ATTENTION : supprimer " +
      selectedId +
      " ?\n\n" +
      "La carte, son activation et sa photo seront supprimées."
    );

  if(!confirmation1) return;

  const confirmation2 =
    prompt(
      "Pour confirmer la suppression définitive de " +
      selectedId +
      ", écris SUPPRIMER"
    );

  if(
    String(confirmation2 || "")
      .trim()
      .toUpperCase() !== "SUPPRIMER"
  ) {
    showMessage("Suppression annulée.");
    return;
  }

  showMessage("⏳ Suppression en cours…");

  const data =
    await bridgeCall(
      "delete",
      {
        cardId: selectedId,
        pinAdmin: pin()
      }
    );

  if(!data || !data.ok) {
    return showMessage(
      "❌ " +
      (
        data
          ? data.message
          : "Erreur inconnue"
      )
    );
  }

  showMessage("✅ " + data.message);

  selectedId = "";
  document.getElementById("editor").style.display = "none";

  setTimeout(function(){
    chercher();
  },500);
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js");
}
</script>
</body>
</html>
