<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080603">
<title>The Gentleman — Administration</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080603;color:#ead8b4;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;min-height:100dvh;padding:14px;
  background:radial-gradient(circle at 80% 5%,rgba(177,116,34,.18),transparent 31%),
             linear-gradient(150deg,#020202,#090704 70%,#171006)
}
.wrap{
  width:100%;max-width:620px;margin:auto;padding:22px 16px 28px;border:2px solid #9b6728;border-radius:24px;
  background:linear-gradient(155deg,#070707,#100c07 72%,#090603)
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{
  width:48px;height:48px;border-radius:14px;border:1px solid #68461d;background:#15110c;color:#e1bf82;
  font-size:22px;font-weight:900
}
.brand{flex:1;text-align:center}
.the{font:12px Georgia,serif;letter-spacing:7px;color:#cda45e}
h1{font:500 clamp(31px,9vw,44px) Georgia,serif;color:#d3a554;margin:0}
.tag{font:italic 15px Georgia,serif;color:#bd914d}
.spacer{width:48px}
.rule{height:1px;margin:18px auto;width:72%;background:linear-gradient(90deg,transparent,#956126,transparent)}
iframe{
  display:block;width:100%;border:0;background:transparent;min-height:1150px;
}
@media(max-width:699px){
  body{padding:14px}
  .wrap{width:100%;max-width:620px;margin:auto;padding:22px 16px 28px}
  iframe{min-height:1500px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='./'">←</button>
    <div class="brand">
      <div class="the">THE</div>
      <h1>GENTLEMAN</h1>
      <div class="tag">Administration</div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="rule"></div>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbxeJnzsyuEIrMjleUmabRIEuoGU2JXbzwewxOrCu9l_hGl1Bla3R6Gg39cjt32ajr4g/exec/admin" title="Administration" scrolling="no"></iframe>
</div>
<script>
const frame=document.getElementById("appFrame");
function resizeFrame(){
  try{
    const doc=frame.contentDocument || frame.contentWindow.document;
    const h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);
    if(h) frame.style.height=(h+20)+"px";
  }catch(e){}
}
frame.addEventListener("load",function(){
  setTimeout(resizeFrame,300);
  setTimeout(resizeFrame,1200);
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
