<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080603">
  <title>The Gentleman — Hôtesse</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../icon-192.png">
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#080603;
      overflow:hidden;
    }
    #app{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#080603;
    }
  </style>
</head>
<body>
  <iframe
    id="app"
    src="../create.html?v=4"
    title="The Gentleman — Hôtesse"
    allow="camera; clipboard-read; clipboard-write; fullscreen"
  ></iframe>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    // Garde l'écran allumé quand Android/Chrome l'autorise.
    let wakeLock = null;

    async function garderEcranAllume() {
      try {
        if (!("wakeLock" in navigator)) return;
        if (document.visibilityState !== "visible") return;

        if (wakeLock && !wakeLock.released) return;

        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", function(){
          wakeLock = null;
        });
      } catch(e) {}
    }

    garderEcranAllume();

    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible") {
        garderEcranAllume();
      }
    });
  </script>
</body>
</html>
