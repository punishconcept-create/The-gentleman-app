<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080603">
  <title>The Gentleman — Créer une carte</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080603;color:#ead8b4;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;min-height:100dvh;padding:14px;

.back{
  width:48px;height:48px;border-radius:14px;border:1px solid #68461d;background:#15110c;color:#e1bf82;

}

.the{font:12px Georgia,serif;letter-spacing:7px;color:#cda45e}

.tag{font:italic 15px Georgia,serif;color:#bd914d}
.spacer{width:48px}
.rule{height:1px;margin:18px auto;width:72%;background:linear-gradient(90deg,transparent,#956126,transparent)}
.sectionTitle{text-align:center;color:#ddb76d;font-size:22px;font-weight:900;margin:0 0 8px}
.sectionDesc{text-align:center;color:#9f927f;font-size:14px;line-height:1.5;margin:0 0 20px}
label{display:block;margin:17px 0 7px;font-weight:900;font-size:15px}
input{
  width:100%;min-height:58px;padding:12px 14px;border:2px solid #986523;border-radius:13px;
  background:#f2eee7;color:#111;font-size:17px
}
button{font-family:inherit;cursor:pointer}
.gold{background:linear-gradient(#dfb35e,#a86e23);color:#160e05;border:0}
.dark{background:#17130d;color:#d6ad65;border:1px solid #74501f}
.danger{background:#351111;color:#efb9a4;border:1px solid #784137}
.action{
  width:100%;min-height:60px;margin-top:10px;border-radius:13px;font-size:16px;font-weight:900
}
.status{
  margin-top:13px;padding:13px;border:1px solid #68461d;border-radius:13px;background:#15110c;
  text-align:center;line-height:1.45;color:#cbbda5
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cardItem{

}
.modeTabs{

}
.modeTab{
  min-height:52px;border-radius:13px;font-size:14px;font-weight:900
}
.modeTab.active{
  background:linear-gradient(#dfb35e,#a86e23);color:#160e05;border:0
}
.modeTab:not(.active){
  background:#17130d;color:#d6ad65;border:1px solid #74501f
}
.searchResult{
  margin-top:10px;padding:14px;border:1px solid #68461d;border-radius:14px;background:#15110c;
}
.searchResultTop{
  display:flex;align-items:center;gap:14px;
}
.searchThumb{
  width:72px;height:72px;min-width:72px;object-fit:cover;
  border:2px solid #a4742c;border-radius:12px;background:#080603;
}
.searchThumbPlaceholder{
  width:72px;height:72px;min-width:72px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #68461d;border-radius:12px;background:#080603;
  font-size:30px;
}
.searchResultInfo{flex:1;min-width:0}

.searchResult .name{font-size:20px;font-weight:900;color:#f5e1bc}
.searchResult .id{font-size:15px;font-weight:900;color:#d1a259;margin-top:3px}
.searchResult .meta{font-size:13px;line-height:1.55;color:#b9ab95;margin-top:8px}
.selectedCard{
  margin:14px 0;padding:15px;border:1px solid #9b6728;border-radius:15px;background:#15110c
}

@media(max-width:699px){
  body{padding:14px}
  .wrap{width:100%;max-width:620px;margin:auto;padding:22px 16px 28px}
  label{font-size:16px}
  input{min-height:60px;font-size:18px}
  .action{min-height:62px;font-size:17px}
}
</style>
</head>
<body>
<iframe id="gentlemanBridge" name="gentlemanBridge" style="display:none;width:0;height:0;border:0"></iframe>
<div class="wrap">
  <div class="top">
    <button id="backBtn" class="back" type="button" style="visibility:hidden" aria-label="Retour">←</button>
<div class="brand">
      <div class="the">THE</div>
      <h1>GENTLEMAN</h1>
      <div class="tag">Créer une carte</div>
      <div style="margin-top:6px;font-size:11px;font-weight:900;letter-spacing:1.6px;color:#d3a554">
        HÔTESSE v3
      </div>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="rule"></div>

  <div class="modeTabs">
    <button id="tabCreate" class="modeTab active" type="button" onclick="changerMode('create')">
      ➕ NOUVELLE CARTE
    </button>
    <button id="tabExisting" class="modeTab" type="button" onclick="changerMode('existing')">
      🔎 CARTE EXISTANTE
    </button>
  </div>

  <div id="createPanel">
    <div class="sectionTitle">CRÉER UNE CARTE</div>
    <div class="sectionDesc">
      Crée la Gentleman Card du client et active-la pour la date sélectionnée.
    </div>

  <label for="pseudo">PSEUDO DU CLIENT</label>
  <input id="pseudo" type="text" placeholder="Ex : King D">
<label for="dateEvenement">DATE DE L’ÉVÉNEMENT</label>
  <input id="dateEvenement" type="date">

  <label>📸 PHOTO DU CLIENT</label>
  <div style="width:100%;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;
              background:#000;border:2px solid #8b5c22;border-radius:18px">
    <div id="placeholder" style="text-align:center;font-weight:900;color:#cbbda5">
      <div style="font-size:72px">🎩</div>
      PHOTO DU CLIENT
    </div>
    <img id="preview" alt="Photo du client" style="display:none;width:100%;max-height:520px;object-fit:contain">
  </div>

  <div class="grid2" style="margin-top:10px">
    <button class="action gold" type="button" onclick="ouvrirCamera()">📸 PRENDRE LA PHOTO</button>
    <button class="action dark" type="button" onclick="ouvrirGalerie()">🖼️ IMPORTER UNE PHOTO</button>
  </div>

  <input id="cameraInput" type="file" accept="image/*" capture="user" hidden onchange="traiterPhoto(event)">
  <input id="galleryInput" type="file" accept="image/*" hidden onchange="traiterPhoto(event)">
  <canvas id="canvas" hidden></canvas>

  <button id="changeBtn" class="action dark" style="display:none" type="button" onclick="changerPhoto()">
    🔄 CHANGER LA PHOTO
  </button>

  <label for="telephone">📲 WHATSAPP DU CLIENT</label>
  <input id="telephone" type="tel" placeholder="Ex : 06 12 34 56 78">

  <label for="email">✉️ E-MAIL DU CLIENT</label>
  <input id="email" type="email" placeholder="Ex : client@gmail.com">

  <label for="pin">🔐 PIN CRÉATION / HÔTESSE</label>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN CRÉATION">

  <button id="createBtn" class="action gold" type="button" onclick="creerCarte()">
    CRÉER ET ACTIVER LA CARTE
  </button>

  <div id="message" class="status" style="display:none"></div>
  </div>

  <div id="existingPanel" style="display:none">
    <div class="sectionTitle">CARTE EXISTANTE</div>
    <div class="sectionDesc">
      Recherche une Gentleman Card déjà créée puis réactive-la pour l’événement.
    </div>

    <label for="searchCard">🔎 RECHERCHE</label>
    <input id="searchCard" type="text" placeholder="N° de carte, pseudo, e-mail ou téléphone">

    <label for="searchPin">🔐 PIN CRÉATION / HÔTESSE</label>
    <input id="searchPin" type="password" inputmode="numeric" placeholder="PIN CRÉATION">

    <button id="searchBtn" class="action gold" type="button" onclick="rechercherCarteHotesse()">
      RECHERCHER LA CARTE
    </button>

    <div id="searchMessage" class="status" style="display:none"></div>
    <div id="searchResults"></div>

    <div id="reactivatePanel" style="display:none">
      <div class="rule"></div>
      <div class="sectionTitle">RÉACTIVER LA CARTE</div>

      <div id="selectedCard" class="selectedCard"></div>

      <label for="reactivateDate">DATE DE L’ÉVÉNEMENT</label>
      <input id="reactivateDate" type="date">

      <label for="reactivateEmail">✉️ E-MAIL DU CLIENT</label>
      <input id="reactivateEmail" type="email" placeholder="Ex : client@gmail.com">

      <label for="reactivateTelephone">📲 TÉLÉPHONE DU CLIENT</label>
      <input id="reactivateTelephone" type="tel" inputmode="tel" placeholder="Ex : 06 12 34 56 78">

      <button id="reactivateBtn" class="action gold" type="button" onclick="reactiverCarteHotesse()">
        ✅ ACTIVER POUR CET ÉVÉNEMENT
      </button>

      <div id="reactivateMessage" class="status" style="display:none"></div>
    </div>
  </div>
</div>

<script>



const BRIDGE_URL = "https://script.google.com/macros/s/AKfycbxeJnzsyuEIrMjleUmabRIEuoGU2JXbzwewxOrCu9l_hGl1Bla3R6Gg39cjt32ajr4g/exec";
const BRIDGE_TIMEOUT = 45000;

function bridgeCall(action, fields) {
  return new Promise(function(resolve) {

    const requestId =
      Date.now().toString(36) +
      Math.random().toString(36).slice(2);

    let finished = false;
    let currentScript = null;

    function finish(data) {
      if (finished) return;
      finished = true;

      if (
        currentScript &&
        currentScript.parentNode
      ) {
        currentScript.parentNode.removeChild(
          currentScript
        );
      }

      resolve(
        data || {
          ok: false,
          message: "Réponse serveur vide."
        }
      );
    }

    function poll() {
      if (finished) return;

      const callbackName =
        "__gentlemanPoll_" +
        requestId.replace(
          /[^A-Za-z0-9_$]/g,
          ""
        );

      window[callbackName] =
        function(payload) {

          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }

          if (
            currentScript &&
            currentScript.parentNode
          ) {
            currentScript.parentNode
              .removeChild(currentScript);
          }

          currentScript = null;

          if (
            payload &&
            payload.ready
          ) {
            finish(payload.data);
            return;
          }

          if (!finished) {
            setTimeout(
              poll,
              650
            );
          }
        };

      currentScript =
        document.createElement("script");

      currentScript.src =
        BRIDGE_URL +
        "?bridgePoll=" +
        encodeURIComponent(requestId) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&_=" +
        Date.now();

      currentScript.onerror =
        function() {

          try {
            delete window[callbackName];
          } catch (e) {}

          if (
            currentScript &&
            currentScript.parentNode
          ) {
            currentScript.parentNode
              .removeChild(currentScript);
          }

          currentScript = null;

          if (!finished) {
            setTimeout(
              poll,
              1000
            );
          }
        };

      document.head.appendChild(
        currentScript
      );
    }


    const values =
      Object.assign(
        {},
        fields || {},
        {
          bridgeAction: action,
          requestId: requestId
        }
      );

    const body =
      new URLSearchParams();

    Object.keys(values)
      .forEach(function(key) {
        body.append(
          key,
          values[key] == null
            ? ""
            : String(values[key])
        );
      });

    fetch(
      BRIDGE_URL,
      {
        method: "POST",
        mode: "no-cors",
        cache: "no-store",
        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: body.toString()
      }
    )
    .catch(function() {});

    setTimeout(
      poll,
      900
    );


    setTimeout(
      function() {

        if (!finished) {
          finish({
            ok: false,
            message:
              "Le serveur n’a pas confirmé l’opération."
          });
        }

      },
      BRIDGE_TIMEOUT
    );

  });
}


let carteSelectionneeHot = null;

function changerMode(mode){
  const createPanel=document.getElementById("createPanel");
  const existingPanel=document.getElementById("existingPanel");
  const tabCreate=document.getElementById("tabCreate");
  const tabExisting=document.getElementById("tabExisting");

  const existing=mode==="existing";

  createPanel.style.display=existing ? "none" : "block";
  existingPanel.style.display=existing ? "block" : "none";

  tabCreate.classList.toggle("active",!existing);
  tabExisting.classList.toggle("active",existing);

  if(existing){
    const dateCreate=document.getElementById("dateEvenement").value;
    if(dateCreate && !document.getElementById("reactivateDate").value){
      document.getElementById("reactivateDate").value=dateCreate;
    }
  }
}

function showSearchMessage(text){
  const el=document.getElementById("searchMessage");
  el.style.display="block";
  el.textContent=text;
}

async function rechercherCarteHotesse(){
  const recherche=document.getElementById("searchCard").value.trim();
  const pin=document.getElementById("searchPin").value.trim();
  const btn=document.getElementById("searchBtn");

  if(recherche.length<2) return showSearchMessage("❌ Saisis au moins 2 caractères.");
  if(!pin) return showSearchMessage("❌ Saisis le PIN création / hôtesse.");

  btn.disabled=true;
  btn.textContent="RECHERCHE…";
  showSearchMessage("⏳ Recherche en cours…");

  const data=await bridgeCall("hostessSearch",{
    recherche,
    pinCreation:pin
  });

  btn.disabled=false;
  btn.textContent="RECHERCHER LA CARTE";

  const results=document.getElementById("searchResults");
  results.innerHTML="";
  document.getElementById("reactivatePanel").style.display="none";
  carteSelectionneeHot=null;

  if(!data || !data.ok){
    return showSearchMessage("❌ "+(data ? data.message : "Erreur inconnue"));
  }

  const cartes=Array.isArray(data.cartes) ? data.cartes : [];

  if(!cartes.length){
    return showSearchMessage("Aucune Gentleman Card trouvée.");
  }

  showSearchMessage("✅ "+cartes.length+" carte(s) trouvée(s).");

  cartes.forEach(function(carte){
    const item=document.createElement("div");
    item.className="searchResult";

    const etat=carte.evenementActif
      ? "🟢 Active actuellement"
      : "⚪ "+(carte.messageEvenement || "Non active");

    item.innerHTML=`
      <div class="searchResultTop">
        ${
          carte.photo
            ? `<img class="searchThumb" src="${safe(carte.photo)}" alt="Photo ${safe(carte.pseudo)}">`
            : `<div class="searchThumbPlaceholder">🎩</div>`
        }
        <div class="searchResultInfo">
          <div class="name">${safe(carte.pseudo)}</div>
          <div class="id">${safe(carte.id)}</div>
          <div class="meta">
            ✉️ ${safe(carte.email || "Aucun e-mail enregistré")}<br>
            📲 ${safe(carte.telephone || "Aucun téléphone enregistré")}<br>
            ${carte.evenement ? "Dernier événement : "+safe(carte.evenement)+"<br>" : ""}
            ${carte.dateEvenementFR ? "📅 "+safe(carte.dateEvenementFR)+"<br>" : ""}
            ${etat}
          </div>
        </div>
      </div>
      <button class="action dark" type="button">SÉLECTIONNER CETTE CARTE</button>
    `;

    item.querySelector("button").addEventListener("click",function(){
      selectionnerCarteHot(carte);
    });

    results.appendChild(item);
  });
}

function selectionnerCarteHot(carte){
  carteSelectionneeHot=carte;

  const panel=document.getElementById("reactivatePanel");
  const selected=document.getElementById("selectedCard");
  const email=document.getElementById("reactivateEmail");
  const telephone=document.getElementById("reactivateTelephone");
  const date=document.getElementById("reactivateDate");

  selected.innerHTML=`
    <div style="display:flex;align-items:center;gap:14px">
      ${
        carte.photo
          ? `<img src="${safe(carte.photo)}" alt="Photo ${safe(carte.pseudo)}"
               style="width:78px;height:78px;object-fit:cover;border:2px solid #a4742c;border-radius:12px;background:#080603">`
          : `<div style="width:78px;height:78px;display:flex;align-items:center;justify-content:center;border:2px solid #68461d;border-radius:12px;background:#080603;font-size:30px">🎩</div>`
      }
      <div>
        <div style="font-size:22px;font-weight:900;color:#f5e1bc">${safe(carte.pseudo)}</div>
        <div style="margin-top:4px;color:#d1a259;font-weight:900">${safe(carte.id)}</div>
      </div>
    </div>
  `;

  email.value=carte.email || "";
  telephone.value=carte.telephone || "";

  const dateCreate=document.getElementById("dateEvenement").value;
  if(dateCreate) date.value=dateCreate;

  document.getElementById("reactivateMessage").style.display="none";
  panel.style.display="block";
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}

async function reactiverCarteHotesse(){
  if(!carteSelectionneeHot) return;

  const dateEvenement=document.getElementById("reactivateDate").value;
  const email=document.getElementById("reactivateEmail").value.trim();
  const telephone=document.getElementById("reactivateTelephone").value.trim();
  const pin=document.getElementById("searchPin").value.trim();
  const btn=document.getElementById("reactivateBtn");
  const msg=document.getElementById("reactivateMessage");

  if(!dateEvenement){
    msg.style.display="block";
    msg.textContent="❌ Choisis la date de l’événement.";
    return;
  }

  if(!pin){
    msg.style.display="block";
    msg.textContent="❌ Saisis le PIN création / hôtesse.";
    return;
  }

  btn.disabled=true;
  btn.textContent="ACTIVATION EN COURS…";
  msg.style.display="block";
  msg.textContent="⏳ Activation en cours…";

  const data=await bridgeCall("hostessReactivate",{
    cardId:carteSelectionneeHot.id,
    evenement:"The Gentleman",
    dateEvenement,
    email,
    telephone,
    pinCreation:pin
  });

  btn.disabled=false;
  btn.textContent="✅ ACTIVER POUR CET ÉVÉNEMENT";

  if(!data || !data.ok){
    msg.textContent="❌ "+(data ? data.message : "Erreur inconnue");
    return;
  }

  msg.innerHTML=
    '<div style="font-weight:900;color:#9fe3a8">✅ CARTE RÉACTIVÉE</div>'+
    '<div style="margin-top:7px">'+safe(carteSelectionneeHot.pseudo)+' — '+safe(carteSelectionneeHot.id)+'</div>'+
    '<div style="margin-top:5px">📅 '+safe(data.dateEvenementFR || dateEvenement)+'</div>'+
    (data.emailAuto && data.emailAuto.ok
      ? '<div style="margin-top:7px;color:#9fe3a8;font-weight:800">✉️ E-mail envoyé automatiquement au client</div>'
      : '<div style="margin-top:7px;color:#cbbda5">Aucun e-mail automatique envoyé.</div>');
}


let photoBase64 = "";
let derniereCarte = null;

function safe(v){
  return String(v || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function showMessage(text){
  const el=document.getElementById("message");
  el.style.display="block";
  el.textContent=text;
}
function ouvrirCamera(){
  const el=document.getElementById("cameraInput");
  el.value="";
  el.click();
}
function ouvrirGalerie(){
  const el=document.getElementById("galleryInput");
  el.value="";
  el.click();
}
function traiterPhoto(event){
  const file=event.target.files && event.target.files[0];
  if(!file) return;

  const reader=new FileReader();
  reader.onload=function(evt){
    const image=new Image();
    image.onload=function(){
      const canvas=document.getElementById("canvas");
      const max=900;
      let w=image.width,h=image.height;

      if(w>h && w>max){h=h*max/w;w=max;}
      else if(h>=w && h>max){w=w*max/h;h=max;}

      canvas.width=Math.round(w);
      canvas.height=Math.round(h);
      canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);

      photoBase64=canvas.toDataURL("image/jpeg",0.80);

      const preview=document.getElementById("preview");
      preview.src=photoBase64;
      preview.style.display="block";
      document.getElementById("placeholder").style.display="none";
      document.getElementById("changeBtn").style.display="block";
    };
    image.src=evt.target.result;
  };
  reader.readAsDataURL(file);
}
function changerPhoto(){
  photoBase64="";
  const preview=document.getElementById("preview");
  preview.src="";
  preview.style.display="none";
  document.getElementById("placeholder").style.display="block";
  document.getElementById("changeBtn").style.display="none";
}
async function creerCarte(){
  const pseudo=document.getElementById("pseudo").value.trim();
  const evenement="The Gentleman";
  const dateEvenement=document.getElementById("dateEvenement").value;
  const telephone=document.getElementById("telephone").value.trim();
  const email=document.getElementById("email").value.trim();
  const pinAdmin=document.getElementById("pin").value.trim();
  const btn=document.getElementById("createBtn");

  if(!pseudo) return showMessage("❌ Saisis le pseudo.");
  
  if(!dateEvenement) return showMessage("❌ Choisis la date de l’événement.");
  if(!photoBase64) return showMessage("❌ Prends ou importe une photo.");
  if(!pinAdmin) return showMessage("❌ Saisis le PIN création.");

  btn.disabled=true;
  btn.textContent="CRÉATION EN COURS…";
  showMessage("⏳ Création en cours…");

  const data=await bridgeCall("create",{
    pseudo,
    photoBase64,
    evenement,
    dateEvenement,
    pinCreation: pinAdmin,
    email,
    telephone
  });

  btn.disabled=false;
  btn.textContent="CRÉER ET ACTIVER LA CARTE";

  if(!data || !data.ok){
    return showMessage("❌ "+(data ? data.message : "Erreur inconnue"));
  }

  derniereCarte={
    id:data.id,
    pseudo:data.pseudo,
    photo:data.photo,
    cardUrl:data.cardUrl,
    telephone,
    email,
    evenement:data.evenement || evenement,
    dateEvenement:data.dateEvenement || dateEvenement
  };

  const el=document.getElementById("message");
  el.style.display="block";
  el.innerHTML=`
    <div style="font-size:20px;font-weight:900;color:#ddb76d">✅ CARTE CRÉÉE ET ACTIVÉE</div>
    ${data.emailAuto && data.emailAuto.ok ? '<div style="margin-top:8px;color:#9fe3a8;font-weight:800">✉️ E-mail envoyé automatiquement</div>' : ''}
    <img src="${safe(data.photo)}" alt="Photo du client"
         style="display:block;width:min(72vw,300px);aspect-ratio:1;object-fit:cover;margin:15px auto;
                border:3px solid #a4742c;border-radius:18px">
    <div style="font-size:28px;font-weight:900">${safe(data.pseudo)}</div>
    <div style="font-size:22px;font-weight:900;color:#d1a259">${safe(data.id)}</div>
    <div style="margin-top:12px;line-height:1.5">
      <strong>${safe(data.evenement)}</strong><br>
      📅 ${safe(data.dateEvenementFR)}
    </div>
    <button class="action gold" type="button" onclick="ouvrirCarte()">🎩 VOIR LA CARTE</button>
    <button class="action dark" type="button" onclick="envoyerWhatsApp()">📲 ENVOYER PAR WHATSAPP</button>
    <button class="action dark" type="button" onclick="envoyerEmail()">✉️ ENVOYER PAR E-MAIL</button>
    <button class="action dark" type="button" onclick="partager()">📤 PARTAGER</button>
    <button class="action dark" type="button" onclick="copierLien()">🔗 COPIER LE LIEN</button>
  `;
}
function ouvrirCarte(){
  if(derniereCarte && derniereCarte.cardUrl) window.open(derniereCarte.cardUrl,"_blank");
}
function normaliserTelephone(numero){
  let tel=String(numero||"").replace(/\D/g,"");
  if(tel.startsWith("0033")) tel=tel.substring(2);
  if(tel.startsWith("0")) tel="33"+tel.substring(1);
  return tel;
}
function envoyerWhatsApp(){
  if(!derniereCarte) return;
  const tel=normaliserTelephone(derniereCarte.telephone);
  if(!tel) return alert("Aucun numéro WhatsApp renseigné.");

  const texte=
    "🎩 *THE GENTLEMAN*\n\n"+
    "Voici ta Gentleman Card personnelle.\n\n"+
    "Cette carte reste la tienne pour les prochains événements.\n"+
    "Elle sera réactivée pour chaque événement réglé.\n\n"+
    "👉 "+derniereCarte.cardUrl;

  window.open("https://wa.me/"+tel+"?text="+encodeURIComponent(texte),"_blank");
}
async function envoyerEmail(){
  if(!derniereCarte || !derniereCarte.email) return alert("Aucune adresse e-mail renseignée.");

  const data=await bridgeCall("email",{
    email:derniereCarte.email,
    pseudo:derniereCarte.pseudo,
    cardUrl:derniereCarte.cardUrl,
    cardId:derniereCarte.id,
    evenement:derniereCarte.evenement || "",
    dateEvenement:derniereCarte.dateEvenement || ""
  });

  alert(data && data.message ? data.message : (data && data.ok ? "E-mail envoyé." : "Erreur lors de l’envoi."));
}
async function partager(){
  if(!derniereCarte) return;

  if(navigator.share){
    try{
      await navigator.share({
        title:"The Gentleman Card",
        text:"Voici ta Gentleman Card personnelle.",
        url:derniereCarte.cardUrl
      });
      return;
    }catch(e){}
  }

  copierLien();
}
async function copierLien(){
  if(!derniereCarte || !derniereCarte.cardUrl) return;

  try{
    await navigator.clipboard.writeText(derniereCarte.cardUrl);
    alert("Lien copié.");
  }catch(e){
    prompt("Copie ce lien :",derniereCarte.cardUrl);
  }
}


(function(){
  const params=new URLSearchParams(window.location.search);
  const source=(params.get("source")||"").toLowerCase();
  const backBtn=document.getElementById("backBtn");

  if(backBtn && source==="admin"){
    backBtn.style.visibility="visible";
    backBtn.addEventListener("click",function(){
      location.href="./";
    });
  }
})();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js?v=3");
}
</script>
