<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0906">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Gentleman">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>The Gentleman</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0b0906; }
    body { font-family: Arial, Helvetica, sans-serif; overflow: hidden; color: #f2e9d9; }
    .app {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      background: radial-gradient(circle at top right, rgba(190,132,45,.14), transparent 30%),
                  linear-gradient(145deg, #030303, #0b0906 70%, #171006);
    }
    .splash {
      position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; background: #0b0906;
      transition: opacity .3s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .mark {
      width: 88px; height: 88px; border-radius: 24px; display: grid; place-items: center;
      border: 2px solid #a87329; font-family: Georgia, serif; font-size: 42px; font-weight: 700;
      color: #d7aa5b; background: linear-gradient(155deg, #070707, #120e08);
      box-shadow: 0 18px 55px rgba(0,0,0,.55);
    }
    .title { font-family: Georgia, serif; font-size: 30px; color: #d7aa5b; }
    .subtitle { color: #bcae97; font-size: 14px; }
    iframe { width: 100%; height: 100%; border: 0; flex: 1; background: #0b0906; }
    .offline {
      display: none; position: absolute; inset: 0; z-index: 20; align-items: center;
      justify-content: center; padding: 28px; text-align: center; background: #0b0906;
    }
    .offline.show { display: flex; }
    .offlineBox {
      max-width: 420px; border: 1px solid #8c6126; border-radius: 18px; padding: 24px;
      background: #120e08;
    }
    .offlineBox h2 { color: #d7aa5b; margin-top: 0; }
    .offlineBox button {
      min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px;
      background: linear-gradient(#dfb45e, #a66d23); font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="splash" class="splash">
      <div class="mark">G</div>
      <div class="title">THE GENTLEMAN</div>
      <div class="subtitle">Ouverture de l’administration…</div>
    </div>

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbxeJnzsyuEIrMjleUmabRIEuoGU2JXbzwewxOrCu9l_hGl1Bla3R6Gg39cjt32ajr4g/exec/admin"
      allow="camera; microphone; clipboard-read; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <div id="offline" class="offline">
      <div class="offlineBox">
        <h2>Connexion requise</h2>
        <p>L’administration Gentleman Card utilise Google Apps Script et nécessite Internet.</p>
        <button onclick="location.reload()">RÉESSAYER</button>
      </div>
    </div>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const frame = document.getElementById('appFrame');
    const offline = document.getElementById('offline');

    frame.addEventListener('load', () => {
      setTimeout(() => splash.classList.add('hide'), 250);
    });

    function updateOnlineState() {
      offline.classList.toggle('show', !navigator.onLine);
    }
    window.addEventListener('online', updateOnlineState);
    window.addEventListener('offline', updateOnlineState);
    updateOnlineState();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
