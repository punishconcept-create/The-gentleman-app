<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080603">
  <title>The Gentleman — Scanner</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#080603;color:#ead8b4;font-family:Arial,Helvetica,sans-serif}
    body{
      min-height:100vh;min-height:100dvh;padding:14px;
      background:radial-gradient(circle at 80% 5%,rgba(177,116,34,.18),transparent 31%),
                 linear-gradient(150deg,#020202,#090704 70%,#171006)
    }
    .wrap{
      width:100%;max-width:620px;margin:auto;padding:22px 16px 28px;border:2px solid #9b6728;border-radius:24px;
      background:linear-gradient(155deg,#070707,#100c07 72%,#090603)
    }
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .back{
      width:48px;height:48px;border-radius:14px;border:1px solid #68461d;background:#15110c;color:#e1bf82;
      font-size:22px;font-weight:900
    }
    .brand{flex:1;text-align:center}
    .the{font:12px Georgia,serif;letter-spacing:7px;color:#cda45e}
    h1{font:500 clamp(31px,9vw,44px) Georgia,serif;color:#d3a554;margin:0}
    .tag{font:italic 15px Georgia,serif;color:#bd914d}
    .spacer{width:48px}
    .rule{height:1px;margin:18px auto;width:72%;background:linear-gradient(90deg,transparent,#956126,transparent)}
    #reader{
      width:100%;overflow:hidden;border-radius:18px;border:2px solid #8b5c22;background:#000;min-height:280px
    }
    #reader video{object-fit:cover!important}
    #reader button{
      min-height:48px;border:0;border-radius:12px;background:linear-gradient(#dfb35d,#a76b20)!important;
      color:#160e05!important;font-weight:900!important;padding:10px 14px!important
    }
    #reader select{min-height:44px;border-radius:10px;padding:8px;background:#f3eee6;color:#111}
    .status{
      margin-top:13px;padding:13px;border:1px solid #68461d;border-radius:13px;background:#15110c;
      text-align:center;line-height:1.45;color:#cbbda5
    }
    .manual{margin-top:20px;padding-top:18px;border-top:1px solid #5e411a}
    .manual label{display:block;margin-bottom:7px;font-weight:900}
    .manual input{
      width:100%;min-height:58px;padding:12px 14px;border:2px solid #986523;border-radius:13px;
      background:#f2eee7;color:#111;font-size:17px
    }
    .manual button{
      width:100%;min-height:60px;margin-top:10px;border:0;border-radius:13px;
      background:linear-gradient(#dfb35e,#a86e23);font-size:17px;font-weight:900
    }
    .hint{margin-top:12px;text-align:center;color:#7f7464;font-size:12px;line-height:1.45}
  
    /* CORRECTION POSITION SÉLECTEUR CAMÉRA */
    #reader__dashboard_section_csr{
      display:flex !important;
      flex-direction:column !important;
      align-items:stretch !important;
      gap:10px !important;
      padding:14px 12px 16px !important;
      background:#050403 !important;
      border-top:1px solid #68461d !important;
    }

    #reader__dashboard_section_csr > div{
      display:flex !important;
      flex-wrap:wrap !important;
      align-items:center !important;
      justify-content:center !important;
      gap:10px !important;
      width:100% !important;
      margin:0 !important;
    }

    #reader__camera_selection{
      width:min(100%, 360px) !important;
      min-height:48px !important;
      margin:0 !important;
      font-size:16px !important;
    }

    #reader__dashboard_section_csr span{
      display:block !important;
      width:100% !important;
      margin:0 0 4px !important;
      text-align:center !important;
      font-size:16px !important;
      color:#ead8b4 !important;
    }

    #reader__dashboard_section_csr button{
      width:min(100%, 260px) !important;
      margin:0 auto !important;
    }

    #reader__scan_region{
      position:relative !important;
      overflow:hidden !important;
      background:#000 !important;
    }

    #reader video{
      display:block !important;
      width:100% !important;
      height:auto !important;
      max-height:760px !important;
      object-fit:cover !important;
    }

    @media(max-width:699px){
      #reader__dashboard_section_csr{
        padding:12px 10px 14px !important;
      }

      #reader__dashboard_section_csr > div{
        flex-direction:column !important;
      }

      #reader__camera_selection{
        width:100% !important;
        max-width:100% !important;
        font-size:16px !important;
      }

      #reader__dashboard_section_csr button{
        width:100% !important;
        max-width:320px !important;
      }
    }

  
    /* CAMÉRA AUTOMATIQUE : aucun sélecteur à afficher */
    #reader__dashboard,
    #reader__dashboard_section_csr,
    #reader__camera_selection,
    #reader__dashboard_section_swaplink {
      display:none !important;
    }

  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="location.href='./'">←</button>
    <div class="brand">
      <div class="the">THE</div>
      <h1>GENTLEMAN</h1>
      <div class="tag">Scanner une carte</div>
    </div>
    <div class="spacer"></div>
  </div>

  <div class="rule"></div>
  <div id="reader"></div>
  <div id="status" class="status">📷 Autorise la caméra, puis présente le QR Code Gentleman.</div>

  <div class="manual">
    <label>OU COLLER UN LIEN / QR</label>
    <input id="manualValue" type="text" placeholder="Colle ici le lien de la carte">
    <button onclick="traiter(document.getElementById('manualValue').value)">OUVRIR LE CONTRÔLE</button>
  </div>

  <div class="hint">Le scanner fonctionne ici directement depuis la PWA GitHub Pages en HTTPS.</div>
</div>

<script>
const BAR_BASE = "https://script.google.com/macros/s/AKfycbxeJnzsyuEIrMjleUmabRIEuoGU2JXbzwewxOrCu9l_hGl1Bla3R6Gg39cjt32ajr4g/exec/bar";
let locked = false;

function extractCardData(text) {
  text = String(text || "").trim();

  try {
    const u = new URL(text);
    const id = u.searchParams.get("id") || "";
    const token = u.searchParams.get("token") || "";
    if (id && token) return { id, token };
  } catch(e) {}

  const m = text.match(/[?&]id=([^&]+).*?[?&]token=([^&]+)/i);
  if (m) {
    return { id: decodeURIComponent(m[1]), token: decodeURIComponent(m[2]) };
  }

  return { id: "", token: "" };
}

function traiter(text) {
  if (locked) return;

  const data = extractCardData(text);
  const status = document.getElementById("status");

  if (!data.id || !data.token) {
    status.textContent = "❌ QR Code Gentleman non reconnu.";
    return;
  }

  locked = true;
  status.innerHTML = "✅ Carte détectée : <strong>" + data.id + "</strong><br>Ouverture du contrôle...";

  const url =
    BAR_BASE +
    "?id=" + encodeURIComponent(data.id) +
    "&token=" + encodeURIComponent(data.token);

  window.location.href = url;
}

function onScanSuccess(decodedText) {
  traiter(decodedText);
}

function onScanFailure(_) {}


window.addEventListener("load", async () => {
  const status = document.getElementById("status");

  if (typeof Html5Qrcode === "undefined") {
    status.textContent = "❌ Le module scanner n'a pas pu se charger. Vérifie la connexion Internet.";
    return;
  }

  const qr = new Html5Qrcode("reader");

  try {
    status.textContent = "📷 Autorisation de la caméra…";

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || !cameras.length) {
      status.textContent = "❌ Aucune caméra détectée.";
      return;
    }

    // Priorité à la caméra arrière.
    let selected = null;

    const rearPatterns = [
      /back/i,
      /rear/i,
      /environment/i,
      /arrière/i,
      /camera 0/i,
      /camera 2/i
    ];

    for (const pattern of rearPatterns) {
      selected = cameras.find(c => pattern.test(c.label || ""));
      if (selected) break;
    }

    // Sur iPhone / Android, si le nom des caméras n'est pas explicite,
    // on prend généralement la dernière caméra listée, souvent l'arrière principale.
    if (!selected) {
      selected = cameras[cameras.length - 1];
    }

    status.textContent = "📷 Caméra arrière activée. Présente le QR Code Gentleman.";

    await qr.start(
      selected.id,
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      },
      onScanSuccess,
      onScanFailure
    );

  } catch (e) {
    status.textContent =
      "❌ Impossible d'activer la caméra : " +
      (e && e.message ? e.message : e);
  }
});


if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
